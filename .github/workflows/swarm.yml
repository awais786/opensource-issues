name: Taiga Sync — Create cards for new assignments

on:
  push:
    paths:
      - "data/assignments.json"   # triggers when claude.ai commits new assignments
  workflow_dispatch:              # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  taiga-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Taiga cards for pending assignments
        env:
          TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
          TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}
        run: python3 taiga_sync.py

      - name: Commit updated assignments with Taiga URLs
        run: |
          git config user.name "awais qureshi"
          git config user.email "awais.qureshi@arbisoft.com"
          git add data/assignments.json
          git diff --cached --quiet || git commit -m "chore: add Taiga URLs to assignments $(date +%Y-%m-%d)"
          git push
